  if(it.k){const g=Math.round(it.chg||0);return{...it,g,v:null,cf:70,s:Math.max(1,Math.min(99,55+g*2)),hi:[],fc:[],spread:.3,tm:0}}
  const h=it.h||[],base=it.b/6,g=Math.round(Math.max(-60,Math.min(300,((it.a+1)/(base+1)-1)*100))),v=it.a+it.b,x=it.x||{},ne=(x.w?1:0)+(x.r?1:0)+(x.hn?1:0)+(x.ms?1:0),cf=Math.round(Math.min(95,35+v*1.5+ne*3)),low=it.n.toLowerCase();
  const tm=low.length>3&&tt.some(t=>t.length>3&&(t.includes(low)||low.includes(t)))?1:0;
  const bn=(x.w?Math.max(0,Math.min(8,((x.w[0]+1)/(x.w[1]+1)-1)*8)):0)+(x.r?Math.min(5,x.r[0]*1.5):0)+(x.hn?Math.min(3,x.hn[0]*1.5):0)+(x.ms?Math.min(2,x.ms[0]/200):0);
  const s=Math.round(Math.max(1,Math.min(99,.7*(.625*Math.max(0,Math.min(g,150))/150*100+.375*Math.min(100,v))+15*tm+bn)));
  return{...it,g,v,cf,s,tm,x,ns:ne+(v>0?1:0)+tm,hi:h,fc:fcast(h),spread:(100-cf)/100};
}
function merged(){
  const map=new Map();
  mkts().forEach(m=>((st.mk[m]&&st.mk[m].items)||[]).forEach(i=>{const k=i.c+'|'+i.n,o=map.get(k);
    if(!o)map.set(k,{...i,h:[...(i.h||[])]});
    else if(!i.k){o.a+=i.a;o.b+=i.b;const x=o.h,y=i.h||[],L=Math.max(x.length,y.length),r=[];for(let j=L;j>0;j--)r.unshift((x[x.length-j]||0)+(y[y.length-j]||0));o.h=r}}));
  return[...map.values()];
}
async function fetchMk(m){try{const r=await fetch('/api/trends?market='+m);if(!r.ok)throw 0;st.mk[m]=await r.json()}catch(e){st.err=T('err')}}
async function load(){
  st.err="";
  try{const r=await fetch('/api/trends');st.meta=await r.json()}catch(e){st.err=T('err')}
  if(st.meta&&!st.meta.empty)await Promise.all(mkts().map(fetchMk));
  st.last=Date.now();
  const empty=!st.meta||st.meta.empty||mkts().every(m=>!(st.mk[m]&&st.mk[m].items&&st.mk[m].items.length));
  draw();if(empty&&!st.err)setTimeout(load,30000);
}
async function ensure(){await Promise.all(mkts().filter(m=>!st.mk[m]).map(fetchMk));draw()}
let tm;
function liveSearch(term,ms){clearTimeout(tm);tm=setTimeout(async()=>{try{const rs=await Promise.all(ms.map(m=>fetch(`/api/trends?market=${m}&q=${encodeURIComponent(term)}`).then(r=>r.json())));st.live={q:term,it:{n:$('#q').value.trim(),c:'custom',a:rs.reduce((x,r)=>x+(r.a||0),0),b:rs.reduce((x,r)=>x+(r.b||0),0),h:[],heads:rs[0].heads||[]}};draw()}catch(e){}},600)}
function draw(){
  document.documentElement.lang=st.lang;
  const tt=titles(),term=$('#q').value.trim().toLowerCase();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===st.cat));
  if(st.meta&&st.meta.updated)$('#upd').textContent=new Date(st.meta.updated).toLocaleString(st.lang==='fr'?'fr-CA':'en-CA',{dateStyle:'medium',timeStyle:'short'});
  const tr=tt.slice(0,14).map(x=>`<span><b>${esc(x)}</b></span>`).join('')||`<span>${T('notr')}</span>`;
  $('#tk').innerHTML=`<span>${T('trend')}</span>`+tr+tr;
  const n=st.regs.size;$('#rsum').textContent=n===1?rn(REG.find(r=>r.id===[...st.regs][0])||{id:[...st.regs][0],fr:[...st.regs][0],en:[...st.regs][0]}):n+' '+T('regs');
  let pool=merged().filter(i=>st.cat==="all"||i.c===st.cat).map(i=>enrich(i,tt));
  let custom=false,wait=false;
  if(term){const m=pool.filter(i=>(i.n+' '+CL.fr[i.c]+' '+CL.en[i.c]).toLowerCase().includes(term));
    if(m.length)pool=m;else if(st.live&&st.live.q===term){pool=[enrich(st.live.it,tt)];custom=true}else{pool=[];wait=true;liveSearch(term,mkts())}}
  pool.sort((a,b)=>b.s-a.s||b.g-a.g);const top=pool.slice(0,100);
  const gs=pool.map(i=>i.g).sort((a,b)=>a-b),med=gs.length?gs[Math.floor(gs.length/2)]:0;
  $('#kpis').innerHTML=[[T('k1'),fmt(pool.length),''],[T('k2'),pool.filter(i=>i.s>=75).length,''],[T('k3'),sg(med),cls(med)],[T('k4'),n]].map(([a,b,c])=>`<div class="k"><small>${a}</small><b ${c?`class="${c}" style="color:var(--${c})"`:''}>${esc(b)}</b></div>`).join('');
  const loading=!top.length&&!wait&&!term;
  $('#ttl').textContent=st.err||(custom?T('custom'):wait?T('analyzing')($('#q').value.trim()):loading?T('load'):T('ttl')(top.length));
  let html='';
  top.forEach((it,i)=>{
    if(i===0)html+=`<tr class="sec"><td colspan="6"><span class="badge">${T('t10')}</span></td></tr>`;
    if(i===10)html+=`<tr class="sec"><td colspan="6">${T('rest')(11,top.length)}</td></tr>`;
    const l=lvl(it.s);
    html+=`<tr class="${i<10?'t10':''}" tabindex="0" data-i="${i}" aria-selected="${st.sel===it.n}"><td>${i+1}</td><td class="n">${esc(it.n)}<small>${CL[st.lang][it.c]||''} · ${it.ns||0} ${T('src')}</small></td><td class="r ${cls(it.g)}">${sg(it.g)}</td><td class="r h">${it.v==null?'—':fmt(it.v)}</td><td class="h">${chart(it,110,30)}</td><td><span class="pill ${l[1]}">${l[0]} · ${it.s}</span></td></tr>`});
  $('#tb').innerHTML=html||`<tr><td colspan="6" class="msg">${st.err||((st.meta&&!wait&&!term)?T('first'):wait?'':T('none'))}</td></tr>`;
  document.querySelectorAll('#tb tr[data-i]').forEach(r=>{const go=()=>{st.sel=top[r.dataset.i].n;document.querySelectorAll('#tb tr[data-i]').forEach(x=>x.setAttribute('aria-selected',x===r));detail(top[r.dataset.i]);if(innerWidth<900)$('#det').scrollIntoView({behavior:'smooth'})};r.onclick=go;r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
  const cur=top.find(i=>i.n===st.sel)||top[0];
  if(cur&&!st.sel){const r=document.querySelector('#tb tr[data-i="0"]');r&&r.setAttribute('aria-selected','true')}
  detail(cur);
}
async function heads(it){
  if(it.k)return[{t:'CoinGecko — '+T('whyC'),u:'https://www.coingecko.com/'}];
  if(it.heads)return it.heads;
  const m=mkts()[0],key=m+'|'+it.n;if(st.hd[key])return st.hd[key];
  try{const r=await(await fetch(`/api/trends?market=${m}&q=${encodeURIComponent(it.n)}`)).json();return st.hd[key]=r.heads||[]}catch(e){return[]}
}
function srcBlock(it){
  if(it.k)return'';const x=it.x||{},d=(a,b)=>{const p=Math.round(((a+1)/(b+1)-1)*100);return `<span class="${cls(p)}">${sg(p)}</span>`};
  const rows=[[T('sNews'),`${it.a} / ${(it.b/6).toFixed(1)} ${T('perDay')}`,it.a+it.b>0],[T('sTr'),it.tm?T('yes'):'—',!!it.tm],[T('sWiki'),x.w?`${fmt(x.w[0])} ${T('views')} · ${d(x.w[0],x.w[1])}`:'—',!!x.w],[T('sRed'),x.r?`${x.r[0]} ${T('posts')} · ${fmt(x.r[1])} pts`:'—',!!x.r],[T('sHn'),x.hn?`${x.hn[0]} ${T('stories')}`:'—',!!x.hn],[T('sMas'),x.ms?`${fmt(x.ms[0])} ${T('uses')}`:'—',!!x.ms]];
  return`<h3 style="font-size:.95rem;margin-top:14px">${T('sources')}</h3>`+rows.map(([n,v,on])=>`<div class="sr${on?' on':''}"><span>${n}</span><b>${v}</b></div>`).join('');
}
function detail(it){
  if(!it){$('#det').innerHTML=`<div class="msg">${st.err||T('load')}</div>`;return}
  const l=lvl(it.s),nm=it.n;
  $('#det').innerHTML=`<h3>${esc(nm)}</h3><div class="sub">${CL[st.lang][it.c]||''}</div>
  <div class="sg"><div><small>${T('chg')}</small><b class="${cls(it.g)}">${sg(it.g)}</b></div><div><small>${T('idx')}</small><b>${it.s} / 100 · ${l[0]}</b></div><div><small>${T('conf')}</small><b>${it.cf} %</b></div></div>
  <div class="lg"><span><i style="background:var(--acc)"></i>${T('lg1')}</span><span><i style="background:var(--fc)"></i>${T('lg2')}</span></div>
  ${chart(it,420,170,true)}
  <h3 style="font-size:.95rem;margin-top:14px">${T('heads')}</h3><div id="hl"><div class="sub">${T('load')}</div></div>
  ${srcBlock(it)}<div class="why">${it.k?T('whyC'):T('why')(it.a,(it.b/6).toFixed(1),it.tm)}</div>`;
  heads(it).then(hs=>{if(st.sel!==nm&&!(st.sel==null))return;const e=$('#hl');if(!e)return;const ok=u=>/^https?:\/\//.test(u)?u:'#';e.innerHTML=hs.map(h=>`<a class="hl" href="${esc(ok(h.u))}" target="_blank" rel="noopener">${esc(h.t)}</a>`).join('')||`<div class="sub">${T('noh')}</div>`});
}
function buildRegions(){
  const f=$('#rf').value.trim().toLowerCase(),box=(r)=>`<label class="ck ${r.id.length<3?'main':''}"><input type="checkbox" value="${r.id}" ${st.regs.has(r.id)?'checked':''}>${esc(rn(r))}</label>`;
  const keep=r=>!f||rn(r).toLowerCase().includes(f);
  $('#cCA').innerHTML=`<h4>Canada</h4>${box({id:'CA'})}<h4>${T('pCA')}</h4>`+REG.filter(r=>r.g==='CA'&&keep(r)).map(box).join('');
  $('#cUS').innerHTML=`<h4>USA</h4>${box({id:'US'})}<h4>${T('pUS')}</h4>`+REG.filter(r=>r.g==='US'&&keep(r)).map(box).join('');
  document.querySelectorAll('.rp input[type=checkbox]').forEach(c=>c.onchange=()=>{c.checked?st.regs.add(c.value):st.regs.delete(c.value);regsChanged()});
}
function regsChanged(){ls('t10-regs',JSON.stringify([...st.regs]));st.sel=null;st.live=null;draw();ensure()}
function setRegs(a){st.regs=new Set(a);buildRegions();regsChanged()}
function applyLang(){
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=T(e.dataset.p));
  document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===st.lang));
  const dk=document.documentElement.dataset.theme==='dark';$('#theme').textContent=dk?'☀':'☾';$('#theme').setAttribute('aria-label',dk?T('dark'):T('light'));$('#theme').title=dk?T('dark'):T('light');
  $('#tabs').innerHTML='';[["all",T('all')],...CATS.map(c=>[c,CL[st.lang][c]])].forEach(([c,l])=>{const b=document.createElement('button');b.className='tab';b.textContent=l;b.dataset.c=c;b.onclick=()=>{st.cat=c;st.sel=null;draw()};$('#tabs').append(b)});
  document.title='TOP10BRANDS';buildRegions();
}
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{const old=mkts().join();st.lang=b.dataset.l;ls('t10-lang',st.lang);applyLang();st.sel=null;draw();if(mkts().join()!==old)ensure()});
$('#theme').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;ls('t10-theme',n);applyLang();draw()};
$('#rf').addEventListener('input',buildRegions);
$('#bAll').onclick=()=>setRegs(['CA','US']);$('#bCA').onclick=()=>setRegs(['CA']);$('#bUS').onclick=()=>setRegs(['US']);$('#bClr').onclick=()=>setRegs([]);
$('#q').addEventListener('input',()=>{st.sel=null;draw()});
document.addEventListener('click',e=>{const d=$('#rd');if(d.open&&!d.contains(e.target))d.open=false});
applyLang();load();
setInterval(()=>{st.mk={};load()},36e5);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-st.last>36e5){st.mk={};load()}});
</script>
